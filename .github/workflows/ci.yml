name: LUMINA core CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.5.0
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: pip install -r services/archive/requirements.txt -r services/api/requirements.txt
      - name: Test core code
        run: PYTHONPATH=. pytest -q --cov=services/archive/app --cov=services/api --cov-report=term-missing --cov-fail-under=80 tests
      - name: Check known Python dependency vulnerabilities
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r services/archive/requirements.txt
          pip-audit -r services/api/requirements.txt
      - name: Static security analysis
        run: |
          pip install bandit==1.8.3
          bandit -q -r services/archive/app services/api/app integrations
      - name: Build LUMINA-owned images
        run: |
          docker build -f services/archive/Dockerfile .
          docker build -f services/api/Dockerfile .
