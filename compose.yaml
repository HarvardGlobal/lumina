services:
  archive-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ARCHIVE_DB_NAME}
      POSTGRES_USER: ${ARCHIVE_DB_USER}
      POSTGRES_PASSWORD: ${ARCHIVE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - archive_data:/var/lib/postgresql/data

  archive:
    build:
      context: .
      dockerfile: services/archive/Dockerfile
    environment:
      ARCHIVE_DATABASE_URL: ${ARCHIVE_DATABASE_URL}
      ARCHIVE_BUCKET: ${ARCHIVE_BUCKET}
      ARCHIVE_OBJECT_STORE_BACKEND: ${ARCHIVE_OBJECT_STORE_BACKEND:-filesystem}
      ARCHIVE_OBJECT_STORE_ROOT: ${ARCHIVE_OBJECT_STORE_ROOT:-/var/lib/lumina-archive}
      ARCHIVE_BEARER_TOKEN: ${ARCHIVE_BEARER_TOKEN:-}
      LUMINA_ENV: ${LUMINA_ENV:-development}
      ARCHIVE_MAX_REQUEST_BYTES: ${ARCHIVE_MAX_REQUEST_BYTES:-26214400}
      ARCHIVE_RATE_LIMIT_REQUESTS_PER_MINUTE: ${ARCHIVE_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_S3_PREFIX: ${ARCHIVE_S3_PREFIX:-lumina-archive}
      ARCHIVE_S3_ENDPOINT_URL: ${ARCHIVE_S3_ENDPOINT_URL:-}
      ARCHIVE_S3_SSE: ${ARCHIVE_S3_SSE:-}
      ARCHIVE_S3_KMS_KEY_ID: ${ARCHIVE_S3_KMS_KEY_ID:-}
      PROMOP_BASE_URL: http://promop:8000
      PROMOP_SERVICE_AUTH_TOKEN: ${PROMOP_SERVICE_AUTH_TOKEN:-lumina-local-promop-service-token}
      PROMOP_REQUEST_TIMEOUT_SECONDS: ${PROMOP_REQUEST_TIMEOUT_SECONDS:-30}
    depends_on:
      archive-db:
        condition: service_healthy
    ports:
      - "${ARCHIVE_API_PORT}:8200"
    volumes:
      - archive_object_data:/var/lib/lumina-archive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  promop-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PROMOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROMOP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROMOP_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - promop_data:/var/lib/postgresql/data

  promop:
    build:
      context: ${LUMINA_COMPONENTS_DIR:-.lumina/components}/promop
    environment:
      DATABASE_URL: postgresql://${PROMOP_POSTGRES_USER}:${PROMOP_POSTGRES_PASSWORD}@promop-db:5432/${PROMOP_POSTGRES_DB}
      SECRET_KEY: ${PROMOP_SECRET_KEY}
      DEBUG: ${PROMOP_DEBUG}
      ADMIN_EMAIL: ${PROMOP_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${PROMOP_ADMIN_PASSWORD}
      APP_BASE_URL: ${PROMOP_APP_BASE_URL}
      SERVICE_AUTH_TOKEN: ${PROMOP_SERVICE_AUTH_TOKEN:-lumina-local-promop-service-token}
      PRODUCTION_URL: ${PROMOP_PUBLIC_URL:-http://localhost:${PROMOP_API_PORT}}
      PORT: 8000
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py setup_admin &&
      gunicorn ctomop.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
      --timeout 120 --access-logfile - --error-logfile - --log-level info"
    depends_on:
      promop-db:
        condition: service_healthy
    ports:
      - "${PROMOP_API_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 12

  wearables:
    build:
      context: ${LUMINA_COMPONENTS_DIR:-.lumina/components}/lumina-wearables
    environment:
      OPEN_WEARABLES_BASE_URL: ${OPEN_WEARABLES_BASE_URL}
      OPEN_WEARABLES_API_KEY: ${OPEN_WEARABLES_API_KEY}
      PROMOP_BASE_URL: http://promop:8000
      PROMOP_SERVICE_AUTH_TOKEN: ${PROMOP_SERVICE_AUTH_TOKEN:-lumina-local-promop-service-token}
      PROMOP_REQUEST_TIMEOUT_SECONDS: ${PROMOP_REQUEST_TIMEOUT_SECONDS:-30}
      LUMINA_WEARABLES_EXPORT_TOKEN: ${LUMINA_WEARABLES_EXPORT_TOKEN:-lumina-local-wearables-export-token}
    depends_on:
      promop:
        condition: service_healthy
    ports:
      - "${WEARABLES_API_PORT}:8300"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  lumina-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ARCHIVE_BASE_URL: ${ARCHIVE_BASE_URL}
      PROMOP_BASE_URL: ${PROMOP_BASE_URL}
      PROMOP_API_BASE: ${PROMOP_API_BASE}
      WEARABLES_BASE_URL: ${WEARABLES_BASE_URL}
    depends_on:
      archive:
        condition: service_healthy
      promop:
        condition: service_healthy
      wearables:
        condition: service_healthy
    ports:
      - "${LUMINA_API_PORT}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  archive_data:
  archive_object_data:
  promop_data:
